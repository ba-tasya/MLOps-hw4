version: 2

models:
  - name: mart_daily_state_metrics
    description: Daily transaction metrics by state
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [transaction_date, us_state]
    columns:
      - name: transaction_date
        description: Transaction date
        data_tests:
          - not_null
      - name: us_state
        description: US state code
        data_tests:
          - not_null
      - name: tx_count
        description: Number of transactions
      - name: total_amount
        description: Sum of amounts
      - name: avg_amount
        description: Average check
      - name: p95_amount
        description: 95th percentile of amount
      - name: large_tx_share
        description: Share of large transactions (amount_bucket large or xlarge), 0-1
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1

  - name: mart_fraud_by_category
    description: Fraud by merchant category; fraud_rank 1 = highest fraud rate
    columns:
      - name: category
        description: Merchant category
        data_tests:
          - unique
          - not_null
      - name: tx_count
        description: Number of transactions
      - name: fraud_count
        description: Number of fraud transactions
      - name: fraud_rate
        description: Fraud share, %
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: total_amount
        description: Sum of all amounts
      - name: fraud_amount
        description: Sum of fraud amounts
      - name: fraud_rank
        description: Rank of the category by fraud_rate
        data_tests:
          - unique

  - name: mart_fraud_by_state
    description: Geographic fraud distribution by US state
    columns:
      - name: us_state
        description: US state code
        data_tests:
          - unique
          - not_null
      - name: state_name
        description: State name from the states seed
        data_tests:
          - not_null
      - name: tx_count
        description: Number of transactions
      - name: fraud_count
        description: Number of fraud transactions
      - name: fraud_rate
        description: Fraud share, %
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100
      - name: unique_customers
        description: Number of unique customers
      - name: unique_merchants
        description: Number of unique merchants
      - name: total_amount
        description: Sum of all amounts
      - name: fraud_amount
        description: Sum of fraud amounts

  - name: mart_customer_risk_profile
    description: >
      Customer risk profile. risk_segment: HIGH if fraud_rate >= 10%,
      MEDIUM if there is any fraud, LOW otherwise
    columns:
      - name: customer_id
        description: Customer surrogate key
        data_tests:
          - unique
          - not_null
      - name: customer_name
        description: Customer name
      - name: us_state
        description: Customer state
      - name: first_transaction_at
        description: First transaction time
      - name: last_transaction_at
        description: Last transaction time
      - name: tx_count
        description: Number of transactions
      - name: fraud_count
        description: Number of fraud transactions
      - name: fraud_rate
        description: Fraud share, %
      - name: avg_amount
        description: Average check
      - name: total_amount
        description: Sum of amounts
      - name: risk_segment
        description: Risk segment
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["HIGH", "MEDIUM", "LOW"]

  - name: mart_hourly_fraud_pattern
    description: Fraud by day of week and hour; high risk window = fraud_rate above 2x overall rate
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [day_of_week, transaction_hour]
    columns:
      - name: day_of_week
        description: ISO day of week (1 = Monday)
        data_tests:
          - not_null
      - name: transaction_hour
        description: Hour (0-23)
        data_tests:
          - not_null
      - name: day_name
        description: Day of week name
      - name: tx_count
        description: Number of transactions
      - name: fraud_count
        description: Number of fraud transactions
      - name: fraud_rate
        description: Fraud share, %
      - name: is_high_risk_window
        description: 1 if fraud_rate is above 2x overall fraud rate
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: mart_merchant_analytics
    description: Merchant metrics; suspicious = fraud_rate above 2x overall rate
    columns:
      - name: merchant
        description: Merchant name
        data_tests:
          - unique
          - not_null
      - name: tx_count
        description: Number of transactions
      - name: turnover
        description: Sum of amounts
      - name: avg_amount
        description: Average check
      - name: fraud_count
        description: Number of fraud transactions
      - name: fraud_rate
        description: Fraud share, %
      - name: is_suspicious
        description: 1 if fraud_rate is above 2x overall fraud rate
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false